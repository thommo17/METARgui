<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - METAR Config</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">METAR Config</a>
    <a class="btn btn-outline-light" href="/">Logout</a>
  </div>
</nav>
<div class="container mt-4">
  {% if message %}
    <div class="alert alert-info">{{ message }}</div>
  {% endif %}
  <h3>Dashboard</h3>
  <a class="btn btn-primary m-2" href="/metar">Edit METAR Config</a>
  <a class="btn btn-primary m-2" href="/wifi">Edit Wi-Fi Config</a>
  <a class="btn btn-warning m-2" href="/restart_metar">Restart METAR Service</a>
  <a class="btn btn-danger m-2" href="/reboot">Reboot Pi</a>
</div>
</body>
</html>
