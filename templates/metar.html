<!DOCTYPE html>
<html>
<head>
  <title>METAR Config</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script>
    function addAirportRow(code = "", led = "") {
      const table = document.getElementById("airports");
      const index = table.rows.length;
      const row = table.insertRow();
      row.innerHTML = `
        <td><input class="form-control" name="airport_code_${index}" value="${code}" placeholder="ICAO"></td>
        <td><input class="form-control" name="airport_led_${index}" value="${led}" placeholder="LED #"></td>
        <td><button type="button" class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">X</button></td>
      `;
    }
  </script>
</head>
<body class="p-4">
  <h3>METAR Map Configuration</h3>

  <form method="post">
    <h5>Airports</h5>
    <table class="table table-sm" id="airports">
      <thead><tr><th>ICAO Code</th><th>LED #</th><th></th></tr></thead>
      <tbody>
        {% for code, led in airports.items() %}
        <tr>
          <td><input class="form-control" name="airport_code_{{ loop.index0 }}" value="{{ code }}"></td>
          <td><input class="form-control" name="airport_led_{{ loop.index0 }}" value="{{ led }}"></td>
          <td><button type="button" class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">X</button></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button type="button" class="btn btn-secondary" onclick="addAirportRow()">+ Add Airport</button>

    <hr>
    <h5>Settings</h5>
    {% for key, value in settings.items() %}
    <div class="row mb-2">
      <div class="col-4"><label>{{ key }}</label></div>
      <div class="col"><input class="form-control" name="settings_{{ key }}" value="{{ value }}"></div>
    </div>
    {% endfor %}

    <hr>
    <h5>Legend</h5>
    {% for key, value in legend.items() %}
    <div class="row mb-2">
      <div class="col-4"><label>{{ key }}</label></div>
      <div class="col"><input class="form-control" name="legend_{{ key }}" value="{{ value }}"></div>
    </div>
    {% endfor %}

    <hr>
    <button class="btn btn-primary">💾 Save</button>
    <a class="btn btn-secondary" href="/dashboard">Back</a>
  </form>

  <hr>
  <h5>Backup / Restore Configuration</h5>

  <div class="mb-3">
    <a class="btn btn-outline-primary" href="/config/download">⬇️ Download Config</a>
  </div>

  <form action="/config/upload" method="post" enctype="multipart/form-data">
    <div class="input-group" style="max-width: 400px;">
      <input type="file" name="file" accept=".conf" class="form-control" required>
      <button class="btn btn-outline-success" type="submit">⬆️ Upload & Replace</button>
    </div>
  </form>

</body>
</html>
